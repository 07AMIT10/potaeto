[project]
name = "potaeto-orchestrator"
version = "0.1.0"
description = "Potaeto model router and skills orchestrator"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "httpx>=0.27.0",
  "python-dotenv>=1.0.1",
  "pydantic>=2.8.0",
  "supabase>=2.5.0",
  "groq>=0.11.0",
  "huggingface-hub>=0.26.0",
  "google-genai>=1.0.0",
  "croniter>=7.0.0",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "pytest-httpx", "httpx", "ruff", "mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]


