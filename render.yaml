# Render Blueprint — deploy Next.js (web) + orchestrator (Docker).
# Connect this repo in Render Dashboard; it auto-detects render.yaml.
# Set all env vars in Render Dashboard or Environment Groups (sync: false = you set them manually).

services:
  # Next.js frontend
  - type: web
    name: potaeto-web
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GOOGLE_GEMINI_API_KEY
        sync: false
      - key: ORCHESTRATOR_URL
        fromService:
          type: web
          name: potaeto-orchestrator
          envVarKey: RENDER_EXTERNAL_URL
      - key: ADMIN_SECRET
        sync: false

  # Python FastAPI orchestrator (Docker)
  - type: web
    name: potaeto-orchestrator
    runtime: docker
    dockerfilePath: apps/orchestrator/Dockerfile
    dockerContext: apps/orchestrator
    plan: free
    region: oregon
    healthCheckPath: /v1/health
    envVars:
      # Required
      - key: GOOGLE_GEMINI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      # Required for reading models_config (RLS is admin-only)
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # Optional providers
      - key: GROQ_API_KEY
        sync: false
      - key: HF_INFERENCE_BASE_URL
        sync: false
      - key: HF_API_KEY
        sync: false
      # Optional tuning
      - key: ENABLED_PROVIDERS
        value: gemini
      - key: MODELS_CONFIG_CACHE_TTL_SEC
        value: "120"
      - key: HEALTH_RATE_LIMIT_BASE_BACKOFF
        value: "15"
      - key: HEALTH_RATE_LIMIT_MAX_BACKOFF
        value: "300"
