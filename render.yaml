# SUPERSEDED — historical Render Blueprint only.
#
# Release 1 deploys to a self-hosted Linux host with systemd + Caddy (see deploy/README.md) and
# uses SQLite, not Supabase. This file is not used by any Release 1 workflow and
# must not be treated as a deployment guide.

services:
  # Next.js frontend
  - type: web
    name: potaeto-web
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GOOGLE_GEMINI_API_KEY
        sync: false
      - key: ORCHESTRATOR_URL
        fromService:
          type: web
          name: potaeto-orchestrator
          envVarKey: RENDER_EXTERNAL_URL
      - key: ADMIN_SECRET
        sync: false

  # Python FastAPI orchestrator (Docker)
  - type: web
    name: potaeto-orchestrator
    runtime: docker
    dockerfilePath: apps/orchestrator/Dockerfile
    dockerContext: apps/orchestrator
    plan: free
    region: oregon
    healthCheckPath: /v1/health
    envVars:
      # Required
      - key: GOOGLE_GEMINI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      # Required for reading models_config (RLS is admin-only)
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # Scheduled jobs (/v1/jobs). Notify steps need the Telegram vars below.
      - key: POTAETO_SCHEDULER_ENABLED
        value: "1"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_ALLOWED_CHAT_IDS
        sync: false
      # Optional providers
      - key: GROQ_API_KEY
        sync: false
      - key: CEREBRAS_API_KEY
        sync: false
      - key: CEREBRAS_BASE_URL
        value: https://api.cerebras.ai/v1
      - key: SAMBANOVA_API_KEY
        sync: false
      - key: SAMBANOVA_BASE_URL
        value: https://api.sambanova.ai/v1
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: OPENROUTER_HTTP_REFERER
        sync: false
      - key: OPENROUTER_APP_TITLE
        value: Potaeto
      - key: HF_INFERENCE_BASE_URL
        sync: false
      - key: HF_API_KEY
        sync: false
      # Optional tuning
      - key: ENABLED_PROVIDERS
        value: gemini,groq,cerebras,sambanova,openrouter
      - key: MODELS_CONFIG_CACHE_TTL_SEC
        value: "120"
      - key: HEALTH_RATE_LIMIT_BASE_BACKOFF
        value: "15"
      - key: HEALTH_RATE_LIMIT_MAX_BACKOFF
        value: "300"
